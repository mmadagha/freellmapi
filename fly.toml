app = 'freellmapi-uk1qhg'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  
[mounts]
  source = 'data_vol'
  destination = '/app/server/data'
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
